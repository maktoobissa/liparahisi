services:
  - type: web
    name: liparahisi
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: PUBLIC_APP_URL
        value: https://liparahisi.onrender.com
      - key: SELCOM_LIVE_ENABLED
        value: "false"
      - key: SELCOM_BASE_URL
        value: ""
      - key: SELCOM_API_KEY
        sync: false
      - key: SELCOM_API_SECRET
        sync: false
      - key: SELCOM_VENDOR
        sync: false
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: ""
      - key: SMTP_USE_SSL
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: liparahisi-db
          property: connectionString
      - key: ADMIN_SETUP_TOKEN
        generateValue: true

databases:
  - name: liparahisi-db
    databaseName: liparahisi
    user: liparahisi
    plan: free
