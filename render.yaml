services:
  - type: web
    name: liparahisi
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: liparahisi-db
          property: connectionString
      - key: ADMIN_SETUP_TOKEN
        generateValue: true

databases:
  - name: liparahisi-db
    databaseName: liparahisi
    user: liparahisi
    plan: 0.1c-256mb
    diskSizeGB: 1
