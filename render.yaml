services:
  - type: web
    name: liparahisi
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: PUBLIC_APP_URL
        value: https://liparahisi.onrender.com
      - key: FRONTEND_URL
        value: https://liparahisi.onrender.com
      - key: BACKEND_URL
        value: https://liparahisi.onrender.com
      - key: SELCOM_BASE_URL
        value: ""
      - key: SELCOM_API_KEY
        sync: false
      - key: SELCOM_API_SECRET
        sync: false
      - key: SELCOM_VENDOR
        sync: false
      - key: CLICKPESA_CLIENT_ID
        sync: false
      - key: CLICKPESA_API_KEY
        sync: false
      - key: CLICKPESA_CHECKSUM_KEY
        sync: false
      - key: CLICKPESA_LIVE_ENABLED
        value: "false"
      - key: CLICKPESA_MANUAL_PAYOUTS_CONFIRMED
        value: "false"
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_SSL
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: liparahisi-db
          property: connectionString
      - key: ADMIN_SETUP_TOKEN
        generateValue: true
      - key: ADMIN_SERVICE_TOKEN
        generateValue: true
      - key: ADMIN_SERVICE_URL
        value: ""
      - key: CATALOG_SERVICE_TOKEN
        generateValue: true
      - key: CATALOG_SERVICE_URL
        value: ""
      - key: IDENTITY_SERVICE_TOKEN
        generateValue: true
      - key: IDENTITY_SERVICE_URL
        value: ""
      - key: ORDERS_SERVICE_TOKEN
        generateValue: true
      - key: ORDERS_SERVICE_URL
        value: ""
      - key: NOTIFICATION_SERVICE_URL
        value: ""

databases:
  - name: liparahisi-db
    databaseName: liparahisi
    user: liparahisi
    plan: free
